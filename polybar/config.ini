[colors]
background = #CC050505
foreground = #CCe9cdcd
border = #CCdb5353

[bar/main]
width = 100%
height = 20pt
radius = 0

wm-restack = bspwm

monitor = ${env:MONITOR:}

background = ${colors.background}
foreground = ${colors.foreground}

font-0 = monospace:size=10;2

padding-left = 1
padding-right = 1
module-margin = 1

border-left-size = 2pt
border-right-size = 2pt
border-bottom-size = 2pt
border-color = ${colors.border}

modules-left = bspwm
modules-center = time
modules-right = fs memory tray date

[module/time]
type = internal/date
interval = 1.0

time = %H:%M

label = %time%

[module/date]
type = internal/date
interval = 1.0

date = %d/%m/%Y

label = %date%

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
inline-mode = false
enable-click = true
enable-scroll = true

label-focused = %name%
label-focused-background = ${colors.border}
label-focused-foreground = #1a1b26
label-focused-padding = 2

label-occupied = %name%
label-occupied-padding = 2

label-urgent = %name%
label-urgent-background = #f7768e
label-urgent-padding = 2

label-empty = %name%
label-empty-foreground = ${colors.foreground}
label-empty-padding = 2

format = <label-state>

[module/tray]
type = internal/tray

tray-spacing = 8px
tray-size = 66%
tray-background = ${colors.background}

[module/memory]
type = internal/memory
interval = 3

format = <label>
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}

label = (%gb_used% / %gb_total%)

[module/fs]
type = internal/fs

mount-0 = /

interval = 30


format-mounted = <label-mounted>
format-mounted-prefix = "DISK "
format-mounted-prefix-foreground = ${colors.primary}


label-mounted = %percentage_used%% (%used% / %total%)


label-unmounted = %mountpoint% não montado
label-unmounted-foreground = ${colors.disabled}