[colors]
background = #1D2021
foreground = #EBDBB2
alt = #A3A094


[bar/main]
width = 75%
height = 20pt
radius = 0

offset-x = 12.5%

wm-restack = bspwm

monitor = ${env:MONITOR:}

background = ${colors.background}
foreground = ${colors.foreground}

font-0 = Terminus:size=16;2

border-bottom-size = 2pt
border-bottom-color = ${colors.alt}
border-left-size = 2pt
border-left-color = ${colors.alt}
border-right-size = 2pt
border-right-color = ${colors.alt}

padding-left = 0
padding-right = 1
module-margin = 1

modules-left = bspwm
modules-center = time
modules-right = fs memory tray date

[module/time]
type = internal/date
interval = 1.0

time = %H:%M

label = %time%

[module/date]
type = internal/date
interval = 1.0

date = %d/%m/%Y

label = %date%

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
inline-mode = false
enable-click = true
enable-scroll = true

label-focused = %name%
label-focused-background = ${colors.alt}
label-focused-foreground = #1a1b26
label-focused-padding = 2

label-occupied = %name%
label-occupied-padding = 2

label-urgent = %name%
label-urgent-background = #f7768e
label-urgent-padding = 2

label-empty = %name%
label-empty-foreground = ${colors.foreground}
label-empty-padding = 2

format = <label-state>

[module/tray]
type = internal/tray

tray-spacing = 8px
tray-size = 66%
tray-background = ${colors.background}

[module/memory]
type = internal/memory
interval = 3

format = <label>
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}

label = %gb_used%

[module/fs]
type = internal/fs

mount-0 = /

interval = 30


format-mounted = <label-mounted>
format-mounted-prefix = "DISK "
format-mounted-prefix-foreground = ${colors.alt}


label-mounted = %used% 


label-unmounted = %mountpoint% não montado
label-unmounted-foreground = ${colors.alt}
